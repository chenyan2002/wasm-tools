[package]
name = "wasm-wave"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors = ["lann.martin@fermyon.com"]
description = "WebAssembly Value Encoding"
documentation = "https://docs.rs/wasm-wave"
categories = ["wasm", "encoding", "parser-implementations"]
repository = "https://github.com/bytecodealliance/wasm-tools/tree/main/crates/wasm-wave"

[lints]
workspace = true

[features]
default = ["std", "wit"]
std = []
wit = ["dep:wit-parser", "dep:anyhow", "std"]
# `std` for `set_handle_label`, as wit-bindgen's async support uses `std` anyway.
wit-bindgen = ["dep:wit-bindgen", "std"]

[dependencies]
logos = { version = "0.16.1", default-features = false, features = ["export_derive", "forbid_unsafe"] }
thiserror = { workspace = true }
wit-parser = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
wit-bindgen = { git = "https://github.com/chenyan2002/wit-bindgen", branch = "fix-async", default-features = false, optional = true, features = ["async"] }

[dev-dependencies]
anyhow.workspace = true
